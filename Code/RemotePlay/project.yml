---
name: RemotePlay
options:
  bundleIdPrefix: com.unshackledpursuit.remoteplay
  xcodeVersion: '27.0'
  deploymentTarget:
    visionOS: '26.0'
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 15
    MARKETING_VERSION: '1.0'
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    EXCLUDED_ARCHS[sdk=xrsimulator*]: x86_64
packages:
  RemotePlayCore:
    path: Packages/RemotePlayCore
targets:
  RemotePlayVision:
    type: application
    platform: visionOS
    productName: Farframe
    sources:
    - path: Apps/Vision/Sources
      excludes:
      - ImmersiveArena/VisionArenaExterior*.swift
    - path: Apps/Vision/Sources/ImmersiveArena
      includes:
      - VisionArenaExterior*.swift
    - Apps/Shared/Sources
    - path: Apps/Vision/Resources
    - path: Apps/Shared/Resources/PrivacyInfo.xcprivacy
    dependencies:
    - package: RemotePlayCore
      product: AccountsAndSecurity
    - package: RemotePlayCore
      product: CommerceCore
    - package: RemotePlayCore
      product: FarframeStorefront
    - package: RemotePlayCore
      product: FarframeCommerceUI
    - package: RemotePlayCore
      product: AppleMediaCore
    - package: RemotePlayCore
      product: ExperienceDomain
    - package: RemotePlayCore
      product: InputCore
    - package: RemotePlayCore
      product: PlayStationRemotePlay
    - package: RemotePlayCore
      product: PlayStationRemotePlayUI
    - package: RemotePlayCore
      product: StreamingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unshackledpursuit.remoteplay.vision
        MARKETING_VERSION: '1.3'
        CURRENT_PROJECT_VERSION: 38
        PRODUCT_NAME: Farframe
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Farframe
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Farframe needs local network
          access to find and connect to your PlayStation 5.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ''
schemes:
  RemotePlayVision:
    build:
      targets:
        RemotePlayVision: all
    run:
      config: Debug
      storeKitConfiguration: Apps/Shared/StoreKit/Farframe.storekit
    archive:
      config: Release
