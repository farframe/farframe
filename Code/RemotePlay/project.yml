name: RemotePlay

options:
  bundleIdPrefix: com.unshackledpursuit.remoteplay
  xcodeVersion: "26.6"
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    visionOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
    # The native simulator XCFramework is intentionally Apple-silicon-only.
    # Shipping iPhone/iPad/Vision and universal Mac slices remain unaffected.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    "EXCLUDED_ARCHS[sdk=xrsimulator*]": x86_64

packages:
  RemotePlayCore:
    path: Packages/RemotePlayCore

targets:
  RemotePlayVision:
    type: application
    platform: visionOS
    productName: Farframe
    sources:
      - Apps/Vision/Sources
      - Apps/Shared/Sources
      - path: Apps/Vision/Resources
      - path: Apps/Shared/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: RemotePlayCore
        product: AccountsAndSecurity
      - package: RemotePlayCore
        product: CommerceCore
      - package: RemotePlayCore
        product: FarframeStorefront
      - package: RemotePlayCore
        product: FarframeCommerceUI
      - package: RemotePlayCore
        product: AppleMediaCore
      - package: RemotePlayCore
        product: ExperienceDomain
      - package: RemotePlayCore
        product: InputCore
      - package: RemotePlayCore
        product: PlayStationRemotePlay
      - package: RemotePlayCore
        product: PlayStationRemotePlayUI
      - package: RemotePlayCore
        product: StreamingCore
    settings:
      base:
        # Farframe keeps one stable identity for preferences, Keychain-backed
        # console registrations, and the cross-platform App Store record.
        PRODUCT_BUNDLE_IDENTIFIER: com.unshackledpursuit.remoteplay.vision
        MARKETING_VERSION: "1.0"
        PRODUCT_NAME: Farframe
        GENERATE_INFOPLIST_FILE: true
        # App/system name. Designed brand assets may use the FARFRAME wordmark.
        INFOPLIST_KEY_CFBundleDisplayName: Farframe
        # Remote Play's standard cryptography protects entertainment content;
        # it does not expose a general-purpose encryption feature.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Farframe needs local network access to find and connect to your PlayStation 5."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  RemotePlayMobile:
    type: application
    platform: iOS
    productName: Farframe
    sources:
      - Apps/Mobile/Sources
      - Apps/Shared/Sources
      - path: Apps/Mobile/Resources
      - path: Apps/Vision/Resources/Licenses
      - path: Apps/Shared/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: RemotePlayCore
        product: AccountsAndSecurity
      - package: RemotePlayCore
        product: CommerceCore
      - package: RemotePlayCore
        product: FarframeStorefront
      - package: RemotePlayCore
        product: FarframeCommerceUI
      - package: RemotePlayCore
        product: AppleMediaCore
      - package: RemotePlayCore
        product: ExperienceDomain
      - package: RemotePlayCore
        product: InputCore
      - package: RemotePlayCore
        product: PlayStationRemotePlay
      - package: RemotePlayCore
        product: PlayStationRemotePlayUI
      - package: RemotePlayCore
        product: StreamingCore
    settings:
      base:
        # Every platform version in the existing Farframe App Store record
        # shares one bundle ID so the lifetime product is a universal purchase.
        PRODUCT_BUNDLE_IDENTIFIER: com.unshackledpursuit.remoteplay.vision
        PRODUCT_NAME: Farframe
        PRODUCT_MODULE_NAME: RemotePlayMobile
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Farframe
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Farframe needs local network access to find and connect to your PlayStation 5."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        # First-release scope: one app scene; external display is deferred.
        INFOPLIST_FILE: Apps/Mobile/Info.plist
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  RemotePlayMac:
    type: application
    platform: macOS
    productName: Farframe
    sources:
      - Apps/Mac/Sources
      - Apps/Shared/Sources
      - path: Apps/Mac/Resources
      - path: Apps/Vision/Resources/Licenses
      - path: Apps/Shared/Resources/PrivacyInfo.xcprivacy
    dependencies:
      - package: RemotePlayCore
        product: AccountsAndSecurity
      - package: RemotePlayCore
        product: CommerceCore
      - package: RemotePlayCore
        product: FarframeStorefront
      - package: RemotePlayCore
        product: FarframeCommerceUI
      - package: RemotePlayCore
        product: AppleMediaCore
      - package: RemotePlayCore
        product: ExperienceDomain
      - package: RemotePlayCore
        product: InputCore
      - package: RemotePlayCore
        product: PlayStationRemotePlay
      - package: RemotePlayCore
        product: PlayStationRemotePlayUI
      - package: RemotePlayCore
        product: StreamingCore
    settings:
      base:
        # Keep the native Mac version inside the same universal Farframe record.
        PRODUCT_BUNDLE_IDENTIFIER: com.unshackledpursuit.remoteplay.vision
        PRODUCT_NAME: Farframe
        PRODUCT_MODULE_NAME: RemotePlayMac
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Farframe
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        # Mac App Store validation (ITMS-90242) requires an app category in Info.plist.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Farframe needs local network access to find and connect to your PlayStation 5."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Apps/Shared/Resources/FarframeMac.entitlements
        ENABLE_APP_SANDBOX: true
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  RemotePlayMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Apps/Mobile/Tests
    dependencies:
      - target: RemotePlayMobile
      - package: RemotePlayCore
        product: AppleMediaCore
      - package: RemotePlayCore
        product: ExperienceDomain
      - package: RemotePlayCore
        product: InputCore
      - package: RemotePlayCore
        product: PlayStationRemotePlay
      - package: RemotePlayCore
        product: PlayStationRemotePlayUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unshackledpursuit.remoteplay.mobile.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false

  # A tap that does nothing is invisible to a unit test: SwiftUI hit testing is
  # resolved by UIKit at touch time, not by anything a value type can be asked
  # about. The one dead-controls bug that trapped a player in a session was
  # therefore unreachable from `RemotePlayMobileTests`, and this target exists
  # so that class of defect has somewhere to fail. It drives the DEBUG-only
  # player preview harness, which needs no PS5, no credentials and no network.
  RemotePlayMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Apps/Mobile/UITests
    dependencies:
      - target: RemotePlayMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unshackledpursuit.remoteplay.mobile.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: RemotePlayMobile
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

  RemotePlayMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Apps/Mac/Tests
    dependencies:
      - target: RemotePlayMac
      - package: RemotePlayCore
        product: AppleMediaCore
      - package: RemotePlayCore
        product: ExperienceDomain
      - package: RemotePlayCore
        product: InputCore
      - package: RemotePlayCore
        product: PlayStationRemotePlay
      - package: RemotePlayCore
        product: PlayStationRemotePlayUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.unshackledpursuit.remoteplay.mac.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false

schemes:
  RemotePlayVision:
    build:
      targets:
        RemotePlayVision: all
    run:
      config: Debug
      storeKitConfiguration: Apps/Shared/StoreKit/Farframe.storekit
    archive:
      config: Release

  RemotePlayMobile:
    build:
      targets:
        RemotePlayMobile: all
    run:
      config: Debug
      storeKitConfiguration: Apps/Shared/StoreKit/Farframe.storekit
    test:
      config: Debug
      targets:
        - RemotePlayMobileTests
        - RemotePlayMobileUITests
    archive:
      config: Release

  RemotePlayMac:
    build:
      targets:
        RemotePlayMac: all
    run:
      config: Debug
      storeKitConfiguration: Apps/Shared/StoreKit/Farframe.storekit
    test:
      config: Debug
      targets:
        - RemotePlayMacTests
    archive:
      config: Release
