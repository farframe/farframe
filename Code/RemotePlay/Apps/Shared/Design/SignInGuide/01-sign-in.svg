<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" role="img" aria-labelledby="title"><title id="title">Enter your email and sign in — illustrated reference with sample details</title><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#ffca66" stroke-width="2" stroke-linejoin="round"/></marker></defs><g font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif"><rect x="24" y="16" width="852" height="264" rx="22" fill="#11141c"/><text x="84" y="74" font-size="30" fill="#cbd1df" font-weight="400" text-anchor="start">Sign-In ID (Email Address)</text><rect x="84" y="96" width="732" height="68" rx="9" fill="#1b202b" stroke="#98a2b6" stroke-width="2"/><text x="108" y="142" font-size="32" fill="#ffffff" font-weight="400" text-anchor="start">player@example.com</text><rect x="84" y="190" width="732" height="64" rx="12" fill="#ffffff"/><text x="450.0" y="233.0" font-size="32" fill="#171b26" font-weight="500" text-anchor="middle">Next</text><rect x="24" y="310" width="852" height="118" rx="18" fill="#1d2638"/><text x="79" y="353" font-size="26" fill="#cbd1df" font-weight="400" text-anchor="start">Then choose</text><rect x="330" y="338" width="498" height="64" rx="12" fill="#1266df"/><text x="579.0" y="381.0" font-size="32" fill="#ffffff" font-weight="500" text-anchor="middle">Sign In with Passkey</text><path d="M265 381 L310 381" fill="none" stroke="#ffca66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/></g></svg>